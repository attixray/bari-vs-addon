name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Restore
        run: nuget restore src\BariVSPackage.sln
      - name: Build
        run: msbuild src\BariVSPackage.sln -nologo -p:Configuration=Release -p:DeployExtension=false -v:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: BariVSPackage-vsix
          path: src/BariVSPackage/bin/Release/*.vsix
          if-no-files-found: error
