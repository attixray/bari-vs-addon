name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Restore
        # The project uses PackageReference, so a solution restore skips packages.config;
        # log4net is referenced from src\packages through a HintPath.
        run: |
          nuget restore src\BariVSPackage.sln
          nuget install src\BariVSPackage\packages.config -OutputDirectory src\packages
      - name: Build
        run: msbuild src\BariVSPackage.sln -nologo -p:Configuration=Release -p:DeployExtension=false -v:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: BariVSPackage.vsix
          path: src/BariVSPackage/bin/Release/BariVSPackage.vsix
          if-no-files-found: error
