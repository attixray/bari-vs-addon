name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Publish this build as a release under this tag, v<manifest version> (leave empty for a normal run)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: |
          [xml]$manifest = Get-Content src\BariVSPackage\source.extension.vsixmanifest
          "version=$($manifest.PackageManifest.Metadata.Identity.Version)" >> $env:GITHUB_OUTPUT
      - name: Find MSBuild and NuGet
        # Use the MSBuild of the runner's Visual Studio and its NuGet CLI instead of
        # setup actions; fetch nuget.exe only if the image has none.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) {
            $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
            Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget
          }
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV
          "NUGET=$nuget" >> $env:GITHUB_ENV
          & $msbuild -version -nologo
          & $nuget help | Select-Object -First 1
      - name: Restore
        # The project uses PackageReference, so a solution restore skips packages.config;
        # log4net is referenced from src\packages through a HintPath.
        run: |
          & $env:NUGET restore src\BariVSPackage.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NUGET install src\BariVSPackage\packages.config -OutputDirectory src\packages
      - name: Build
        run: '& $env:MSBUILD src\BariVSPackage.sln -nologo -p:Configuration=Release -p:DeployExtension=false -v:minimal'
      - uses: actions/upload-artifact@v7
        with:
          name: BariVSPackage.vsix
          path: src/BariVSPackage/bin/Release/BariVSPackage.vsix
          if-no-files-found: error

  release:
    # A pushed tag v<version>, or a manual run with release-tag set, becomes a GitHub release
    # with the VSIX, so it outlives the CI artifact. A manual run creates the tag on the commit
    # it built if the tag does not exist yet.
    if: github.ref_type == 'tag' || inputs.release-tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: BariVSPackage.vsix
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release-tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::The tag $TAG does not match the manifest version $VERSION; expected v$VERSION."
            exit 1
          fi
          target=()
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG is on $commit, but this run built $GITHUB_SHA."
              exit 1
            fi
          else
            target=(--target "$GITHUB_SHA")
          fi
          sha256sum BariVSPackage.vsix > SHA256SUMS
          cat > notes.md <<NOTES
          Bari Visual Studio add-on $VERSION for Visual Studio 2026. See the README for installing and upgrading.
          NOTES
          gh release create "$TAG" "${target[@]}" --draft --title "Bari add-on $VERSION" --notes-file notes.md --generate-notes
          gh release upload "$TAG" BariVSPackage.vsix SHA256SUMS
          gh release edit "$TAG" --draft=false
